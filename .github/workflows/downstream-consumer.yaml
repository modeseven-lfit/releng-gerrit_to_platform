---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Downstream consumer workflow demonstrating gerrit_json usage
# This workflow simulates a downstream consumer that receives both:
# 1. The new gerrit_json consolidated variable
# 2. All 10 individual GERRIT_* variables
#
# IMPORTANT: This workflow intentionally has 11 inputs (exceeding GitHub's
# 10-input limit for workflow_dispatch) to show the exact problem that
# gerrit_json solves. The actionlint error is EXPECTED and proves the issue.
#
# This shows:
# - OLD WAY: 10 individual GERRIT_* inputs (at the limit, can't add more)
# - NEW WAY: 1 gerrit_json input (leaves 9 slots free for other parameters)
#
# In production, workflows should use EITHER the gerrit_json OR the individual
# variables, not both. This test workflow uses both to validate equivalence.

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      # New consolidated variable
      gerrit_json:
        description: 'Gerrit event data as JSON'
        required: true
        type: string

      # Legacy individual variables (10 total - at workflow_dispatch limit!)
      GERRIT_BRANCH:
        description: 'Branch'
        required: true
        type: string
      GERRIT_CHANGE_ID:
        description: 'Change ID'
        required: true
        type: string
      GERRIT_CHANGE_NUMBER:
        description: 'Change number'
        required: true
        type: string
      GERRIT_CHANGE_URL:
        description: 'Change URL'
        required: true
        type: string
      GERRIT_EVENT_TYPE:
        description: 'Event type'
        required: true
        type: string
      GERRIT_PATCHSET_NUMBER:
        description: 'Patchset number'
        required: true
        type: string
      GERRIT_PATCHSET_REVISION:
        description: 'Patchset revision (commit SHA)'
        required: true
        type: string
      GERRIT_PROJECT:
        description: 'Project name'
        required: true
        type: string
      GERRIT_REFSPEC:
        description: 'Refspec'
        required: true
        type: string
      GERRIT_COMMENT:
        description: 'Comment (optional, for comment-added events)'
        required: false
        type: string
        default: ''

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  validate-inputs:
    name: "Validate received inputs"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      json_branch: ${{ steps.parse-json.outputs.branch }}
      json_change_number: ${{ steps.parse-json.outputs.change_number }}
      json_event_type: ${{ steps.parse-json.outputs.event_type }}
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: "Display received inputs"
        shell: bash
        # yamllint disable rule:line-length
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          {
            echo "## Received Inputs"
            echo ""
            echo "### Legacy Individual Variables (10 inputs):"
            echo "- GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}"
            echo "- GERRIT_CHANGE_ID: ${{ inputs.GERRIT_CHANGE_ID }}"
            echo "- GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}"
            echo "- GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}"
            echo "- GERRIT_EVENT_TYPE: ${{ inputs.GERRIT_EVENT_TYPE }}"
            echo "- GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}"
            echo "- GERRIT_PATCHSET_REVISION: ${{ inputs.GERRIT_PATCHSET_REVISION }}"
            echo "- GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}"
            echo "- GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}"
            echo "- GERRIT_COMMENT: ${{ inputs.GERRIT_COMMENT }}"
            echo ""
            echo "### New Consolidated Variable (1 input):"
            echo '```json'
            echo '${{ inputs.gerrit_json }}' | jq '.'
            echo '```'
          } >> "$SUMMARY"
        # yamllint enable rule:line-length

      - name: "Validate gerrit_json with Shell script"
        shell: bash
        run: |
          echo "Validating gerrit_json with verify-json.sh..."
          chmod +x examples/verify-json.sh
          ./examples/verify-json.sh '${{ inputs.gerrit_json }}'
          echo "✓ Shell validation passed"

      - name: "Validate gerrit_json with Python script"
        shell: bash
        run: |
          echo "Validating gerrit_json with verify-json.py..."
          chmod +x examples/verify-json.py
          ./examples/verify-json.py '${{ inputs.gerrit_json }}'
          echo "✓ Python validation passed"

      - name: "Parse gerrit_json"
        id: parse-json
        shell: bash
        # yamllint disable rule:line-length
        run: |
          echo "Parsing gerrit_json..."
          JSON='${{ inputs.gerrit_json }}'
          OUT="$GITHUB_OUTPUT"

          {
            echo "branch=$(echo "$JSON" | jq -r '.branch')"
            echo "change_id=$(echo "$JSON" | jq -r '.change_id')"
            echo "change_number=$(echo "$JSON" | jq -r '.change_number')"
            echo "change_url=$(echo "$JSON" | jq -r '.change_url')"
            echo "event_type=$(echo "$JSON" | jq -r '.event_type')"
            echo "patchset_number=$(echo "$JSON" | jq -r '.patchset_number')"
            echo "patchset_revision=$(echo "$JSON" | jq -r '.patchset_revision')"
            echo "project=$(echo "$JSON" | jq -r '.project')"
            echo "refspec=$(echo "$JSON" | jq -r '.refspec')"
          } >> "$OUT"

          echo "✓ Successfully parsed gerrit_json"
        # yamllint enable rule:line-length

      - name: "Compare legacy vs JSON values"
        shell: bash
        # yamllint disable rule:line-length
        run: |
          echo "Comparing legacy variables with parsed JSON values..."

          # Compare each field
          ERRORS=0

          if [ "${{ inputs.GERRIT_BRANCH }}" != \
            "${{ steps.parse-json.outputs.branch }}" ]; then
            echo "❌ BRANCH mismatch"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ BRANCH matches"
          fi

          if [ "${{ inputs.GERRIT_CHANGE_ID }}" != \
            "${{ steps.parse-json.outputs.change_id }}" ]; then
            echo "❌ CHANGE_ID mismatch"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ CHANGE_ID matches"
          fi

          if [ "${{ inputs.GERRIT_CHANGE_NUMBER }}" != \
            "${{ steps.parse-json.outputs.change_number }}" ]; then
            echo "❌ CHANGE_NUMBER mismatch"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ CHANGE_NUMBER matches"
          fi

          if [ "${{ inputs.GERRIT_CHANGE_URL }}" != \
            "${{ steps.parse-json.outputs.change_url }}" ]; then
            echo "❌ CHANGE_URL mismatch"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ CHANGE_URL matches"
          fi

          if [ "${{ inputs.GERRIT_EVENT_TYPE }}" != \
            "${{ steps.parse-json.outputs.event_type }}" ]; then
            echo "❌ EVENT_TYPE mismatch"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ EVENT_TYPE matches"
          fi

          if [ "${{ inputs.GERRIT_PATCHSET_NUMBER }}" != \
            "${{ steps.parse-json.outputs.patchset_number }}" ]; then
            echo "❌ PATCHSET_NUMBER mismatch"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ PATCHSET_NUMBER matches"
          fi

          if [ "${{ inputs.GERRIT_PATCHSET_REVISION }}" != \
            "${{ steps.parse-json.outputs.patchset_revision }}" ]; then
            echo "❌ PATCHSET_REVISION mismatch"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ PATCHSET_REVISION matches"
          fi

          if [ "${{ inputs.GERRIT_PROJECT }}" != \
            "${{ steps.parse-json.outputs.project }}" ]; then
            echo "❌ PROJECT mismatch"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ PROJECT matches"
          fi

          if [ "${{ inputs.GERRIT_REFSPEC }}" != \
            "${{ steps.parse-json.outputs.refspec }}" ]; then
            echo "❌ REFSPEC mismatch"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ REFSPEC matches"
          fi

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "❌ Found $ERRORS mismatches between legacy and JSON values"
            exit 1
          fi

          echo ""
          echo "✅ All values match between legacy and JSON formats"
        # yamllint enable rule:line-length

      - name: "Validation summary"
        shell: bash
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "## Validation Results"
            echo ""
            echo "✅ gerrit_json is valid JSON"
            echo "✅ All required fields present"
            echo "✅ Shell validation script passed"
            echo "✅ Python validation script passed"
            echo "✅ JSON and legacy format values match"
          } >> "$SUMMARY"

  demonstrate-usage:
    name: "Demonstrate typical usage patterns"
    needs: validate-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: "Usage Pattern 1: Legacy approach (10 inputs)"
        shell: bash
        # yamllint disable rule:line-length
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          {
            echo "## Legacy Approach (10 workflow inputs)"
            echo ""
            echo "Using individual GERRIT_* variables requires passing 10 inputs:"
            echo ""
            echo '```yaml'
            echo "workflow_dispatch:"
            echo "  inputs:"
            echo "    GERRIT_BRANCH: { required: true }"
            echo "    GERRIT_CHANGE_ID: { required: true }"
            echo "    GERRIT_CHANGE_NUMBER: { required: true }"
            echo "    GERRIT_CHANGE_URL: { required: true }"
            echo "    GERRIT_EVENT_TYPE: { required: true }"
            echo "    GERRIT_PATCHSET_NUMBER: { required: true }"
            echo "    GERRIT_PATCHSET_REVISION: { required: true }"
            echo "    GERRIT_PROJECT: { required: true }"
            echo "    GERRIT_REFSPEC: { required: true }"
            echo "    GERRIT_COMMENT: { required: false }"
            echo '```'
            echo ""
            echo "⚠️ This is at the workflow_dispatch limit of 10 inputs!"
          } >> "$SUMMARY"

      - name: "Usage Pattern 2: New gerrit_json approach (1 input)"
        shell: bash
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "## New gerrit_json Approach (1 workflow input)"
            echo ""
            echo "Using gerrit_json requires only 1 input:"
            echo ""
            echo '```yaml'
            echo "workflow_dispatch:"
            echo "  inputs:"
            echo "    gerrit_json:"
            echo "      required: true"
            echo "      type: string"
            echo '```'
            echo ""
            echo "✅ This leaves 9 input slots for other workflow parameters!"
          } >> "$SUMMARY"

      - name: "Usage Pattern 3: Conditional logic based on event type"
        shell: bash
        run: |
          EVENT_TYPE="${{ needs.validate-inputs.outputs.json_event_type }}"

          echo "Processing event type: $EVENT_TYPE"

          case "$EVENT_TYPE" in
            patchset-created)
              echo "✓ Running patchset verification tasks"
              echo "  - Fetch change using refspec"
              echo "  - Run linting and tests"
              echo "  - Post results back to Gerrit"
              ;;
            change-merged)
              echo "✓ Running post-merge tasks"
              echo "  - Update documentation"
              echo "  - Trigger release pipeline"
              echo "  - Notify stakeholders"
              ;;
            comment-added)
              echo "✓ Processing comment"
              echo "  - Parse for ChatOps commands"
              echo "  - Trigger requested workflows"
              ;;
          esac

      - name: "Usage Pattern 4: Pass to another workflow"
        shell: bash
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "## Passing to Downstream Workflows"
            echo ""
            echo "With gerrit_json, passing data to downstream workflows is simple:"
            echo ""
            echo '```bash'
            echo "# With gerrit_json (1 parameter)"
            echo "gh workflow run downstream.yml \\"
            echo "  -f gerrit_json='\${{ inputs.gerrit_json }}'"
            echo ""
            echo "# vs. Legacy approach (10 parameters)"
            echo "gh workflow run downstream.yml \\"
            echo "  -f GERRIT_BRANCH='\${{ inputs.GERRIT_BRANCH }}' \\"
            echo "  -f GERRIT_CHANGE_ID='\${{ inputs.GERRIT_CHANGE_ID }}' \\"
            echo "  -f GERRIT_CHANGE_NUMBER='\${{ inputs.GERRIT_CHANGE_NUMBER }}' \\"
            echo "  -f GERRIT_CHANGE_URL='\${{ inputs.GERRIT_CHANGE_URL }}' \\"
            echo "  -f GERRIT_EVENT_TYPE='\${{ inputs.GERRIT_EVENT_TYPE }}' \\"
            echo "  -f GERRIT_PATCHSET_NUMBER='\${{ inputs.GERRIT_PATCHSET_NUMBER }}' \\"
            echo "  -f GERRIT_PATCHSET_REVISION='\${{ inputs.GERRIT_PATCHSET_REVISION }}' \\"
            echo "  -f GERRIT_PROJECT='\${{ inputs.GERRIT_PROJECT }}' \\"
            echo "  -f GERRIT_REFSPEC='\${{ inputs.GERRIT_REFSPEC }}' \\"
            echo "  -f GERRIT_COMMENT='\${{ inputs.GERRIT_COMMENT }}'"
            echo '```'
          } >> "$SUMMARY"

  final-summary:
    name: "Final Summary"
    needs:
      - validate-inputs
      - demonstrate-usage
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "Generate summary"
        shell: bash
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY"
          {
            echo "## 🎉 Downstream Consumer Test Complete"
            echo ""
            echo "### Key Findings:"
            echo ""
            echo "1. ✅ Successfully received all 10 legacy GERRIT_* variables"
            echo "2. ✅ Successfully received gerrit_json consolidated variable"
            echo "3. ✅ Both validation scripts work correctly"
            echo "4. ✅ All values match between legacy and JSON formats"
            echo "5. ✅ JSON parsing and field extraction works as expected"
            echo ""
            echo "### Benefits of gerrit_json:"
            echo ""
            echo "- **Reduced complexity**: 1 input instead of 10"
            echo "- **Flexibility**: Frees up 9 input slots for other parameters"
            echo "- **Easier forwarding**: Single variable to pass between workflows"
            echo "- **Extensible**: Can add new fields without changing workflow signatures"
            echo "- **Validated**: Built-in validation scripts ensure data integrity"
          } >> "$SUMMARY"
